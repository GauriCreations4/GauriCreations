<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta http-equiv="refresh" content="1; url=login.html" />
<title>Redirecting • Gauri Creations</title>

<!-- Favicon -->
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="favicon.ico">

<style>
  :root {
    --bg-grad: linear-gradient(135deg, #86e1ff, #ffd4b8);
    --card-bg: rgba(255, 255, 255, 0.95);
    --shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-grad);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #0f172a;
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: var(--card-bg);
    padding: 30px 24px;
    border-radius: 24px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  .logo {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    margin-bottom: 16px;
    object-fit: cover;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #e2e8f0;
    border-top: 3px solid #2563eb;
    border-radius: 50%;
    margin: 16px auto;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  p {
    font-size: 14px;
    color: #475569;
    margin: 8px 0;
  }

  a {
    color: #2563eb;
    font-weight: 600;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="card">
  <img src="logo-gauri.jpeg" alt="Gauri Creations" class="logo" onerror="this.src='https://via.placeholder.com/60?text=GC'" />
  <div class="spinner"></div>
  <p>Connecting to <strong>Gauri Creations</strong>...</p>
  <p style="font-size: 12px; margin-top: 12px;">
    If you are not redirected automatically, <a href="login.html">click here</a>.
  </p>
</div>

<script>
  // Clean JS replace prevents the browser back-button redirection trap
  setTimeout(function() {
    window.location.replace("login.html");
  }, 500);
</script>

</body>
</html>
