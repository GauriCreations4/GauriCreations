<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gauri Creations • Store</title>

<!-- PWA & Meta -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="logo-gauri.jpeg">

<style>
  :root { 
    --bg-grad: linear-gradient(135deg, #e3f2ff, #ffe5f3); 
    --accent-grad: linear-gradient(135deg, #2563eb, #ec4899); 
    --primary: #2563eb; 
    --card-bg: rgba(255, 255, 255, 0.92);
    --shadow: 0 15px 35px rgba(15, 23, 42, 0.12);
  }

  * { box-sizing: border-box; }

  body { 
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: var(--bg-grad);
    padding: 15px 15px calc(100px + env(safe-area-inset-bottom)) 15px; 
    display: flex;
    justify-content: center; 
    color: #0f172a;
  }

  .shell { width: 100%; max-width: 1150px; }

  /* Interactive Animations */
  .menu-btn, .cat-chip, .btn-primary, .btn-icon, .product-card, .header-row { 
    transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); 
  }
  
  .menu-btn:hover { transform: scale(1.05); }
  .menu-btn:active { transform: scale(0.95); }
  .cat-chip:hover { transform: translateY(-2px); background: #ffffff; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3); }
  .btn-icon:hover { transform: scale(1.15) rotate(-5deg); }
  
  .product-card:hover { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(15, 23, 42, 0.15); }
  .product-card:active { transform: scale(0.98); }

  /* STICKY HEADER */
  .header-row { 
    position: sticky; 
    top: 10px; 
    z-index: 500; 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    background: rgba(255, 255, 255, 0.92); 
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 12px 18px; 
    border-radius: 20px; 
    border: 1px solid rgba(255, 255, 255, 0.7); 
    box-shadow: var(--shadow); 
    margin-bottom: 16px; 
  }

  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-logo { width: 44px; height: 44px; min-width: 44px; border-radius: 12px; object-fit: cover; background: #ffffff; }
  
  .menu-btn { 
    background: var(--accent-grad); 
    color: #ffffff; 
    padding: 8px 16px; 
    border-radius: 999px; 
    font-weight: 700; 
    border: none; 
    cursor: pointer; 
    white-space: nowrap; 
    font-size: 13px;
  }

  .menu-list { 
    display: none; 
    position: absolute; 
    top: 65px; 
    right: 0; 
    background: #ffffff; 
    border-radius: 16px; 
    min-width: 190px; 
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2); 
    overflow: hidden; 
    z-index: 600; 
    border: 1px solid #e2e8f0;
  }

  .menu-list a { 
    display: block; 
    padding: 12px 18px; 
    text-decoration: none; 
    color: #0f172a; 
    font-size: 13px;
    font-weight: 600;
    border-bottom: 1px solid #f1f5f9; 
    transition: background 0.2s, padding-left 0.2s;
  }

  .menu-list a:last-child { border-bottom: none; }
  .menu-list a:hover { background: #f0f9ff; color: var(--primary); padding-left: 22px; }

  /* HERO BANNER */
  .hero { display: flex; gap: 16px; margin-bottom: 20px; }
  
  .hero-main { 
    flex: 2; 
    background: var(--card-bg); 
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 24px; 
    border-radius: 22px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    text-align: center; 
    box-shadow: var(--shadow); 
    border: 1px solid rgba(255, 255, 255, 0.7); 
  }

  .hero-side { 
    flex: 1; 
    background: var(--accent-grad); 
    color: #ffffff; 
    padding: 24px; 
    border-radius: 22px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    box-shadow: var(--shadow); 
  }

  .hero-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; color: #0f172a; }
  .hero-sub { color: #64748b; font-size: 13px; }
  #summaryTotal { font-size: 42px; font-weight: 800; line-height: 1.2; }
  
  @media(max-width: 700px) { 
    .hero { flex-direction: column; } 
    .hero-side { padding: 16px 24px; flex-direction: row; justify-content: space-between; } 
    #summaryTotal { font-size: 28px; }
  }

  /* FILTERS */
  #searchInput { 
    width: 100%; 
    padding: 12px 16px; 
    border-radius: 14px; 
    border: 1px solid #cbd5e1; 
    margin-bottom: 12px; 
    font-size: 14px;
    background: #ffffff;
    outline: none;
    transition: border-color 0.2s; 
  }

  #searchInput:focus { border-color: var(--primary); }

  .category-bar { 
    display: flex; 
    gap: 8px; 
    overflow-x: auto; 
    padding-bottom: 6px; 
    scrollbar-width: none; 
    margin-bottom: 16px; 
  }

  .category-bar::-webkit-scrollbar { display: none; }

  .cat-chip { 
    background: rgba(255, 255, 255, 0.85); 
    border: 1px solid #cbd5e1; 
    padding: 8px 18px; 
    border-radius: 999px; 
    font-size: 13px; 
    font-weight: 600;
    cursor: pointer; 
    white-space: nowrap; 
    color: #475569;
  }

  .cat-chip.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }

  /* PRODUCT GRID */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }

  .product-card { 
    border-radius: 20px; 
    background: var(--card-bg); 
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.7); 
    padding: 12px; 
    display: flex; 
    flex-direction: column; 
    gap: 8px; 
    position: relative; 
    box-shadow: var(--shadow);
  }

  .product-img-wrap { 
    border-radius: 14px; 
    overflow: hidden; 
    background: #f1f5f9; 
    height: 150px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    position: relative;
  }

  .product-img { width: 100%; height: 100%; object-fit: cover; }
  
  .wish-btn { 
    position: absolute; 
    top: 8px; 
    right: 8px; 
    background: rgba(255, 255, 255, 0.9); 
    border-radius: 50%; 
    width: 30px; 
    height: 30px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    cursor: pointer; 
    font-size: 14px; 
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    z-index: 5; 
  }

  .btn-primary { 
    width: 100%; 
    background: var(--accent-grad); 
    color: #ffffff; 
    border-radius: 12px; 
    padding: 10px; 
    border: none; 
    font-weight: 700; 
    font-size: 13px;
    cursor: pointer; 
    margin-top: auto; 
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
  }

  /* FOOTER */
  .social-footer { margin-top: 40px; display: flex; justify-content: center; gap: 20px; }
  
  .btn-icon { 
    width: 52px; 
    height: 52px; 
    border-radius: 50%; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    color: #ffffff; 
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15); 
    text-decoration: none; 
  }

  .btn-icon svg { width: 28px; height: 28px; fill: #ffffff; }
  .wa-bg { background-color: #25D366; }
  .ig-bg { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
</style>
</head>

<body>
<div class="shell">

  <!-- HEADER -->
  <header class="header-row">
    <div class="brand">
      <img src="logo-gauri.jpeg" class="brand-logo" alt="Gauri Creations" onerror="this.src='https://via.placeholder.com/45?text=GC'">
      <div>
        <div style="font-weight:800; font-size:18px; line-height:1.2;">Gauri Creations</div>
        <div id="subWelcome" style="font-size:12px; color:#64748b;">Welcome</div>
      </div>
    </div>

    <div style="position: relative;">
      <button class="menu-btn" onclick="toggleMenu()">≡ Menu</button>
      <div id="menuList" class="menu-list">
        <a href="store.html">🏠 Home</a>
        <a href="my-orders.html">📦 My Orders</a>
        <a href="track.html">🚚 Track Parcel</a>
        <a href="https://wa.me/917745092723" target="_blank">💬 Support</a>
        <a href="#" id="authLink" onclick="handleAuthClick()" style="color:#e11d48;">🔑 Login / Register</a>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-main">
      <img src="logo-gauri.jpeg" style="width:80px; height:80px; object-fit:cover; border-radius:16px; margin-bottom:12px;" onerror="this.src='https://via.placeholder.com/80?text=GC'">
      <div class="hero-title" id="welcomeText">Gauri Creations Store</div>
      <div class="hero-sub">Discover exclusive handcrafted decor, platters & rangoli designs...</div>
    </div>
    <aside class="hero-side">
      <div style="font-size:13px; opacity:0.9; font-weight:600;">Total Products</div>
      <div id="summaryTotal">...</div>
    </aside>
  </section>

  <!-- SEARCH & CATEGORY FILTERS -->
  <div class="filters">
    <input id="searchInput" placeholder="Search handcrafted designs..." oninput="filter()" />
    <div id="categoryBar" class="category-bar"></div>
  </div>

  <!-- PRODUCT GRID -->
  <main id="grid" class="grid">
    <div style="grid-column: 1 / -1; text-align: center; color: #64748b; padding: 40px 0;">Loading catalog...</div>
  </main>

  <!-- FOOTER -->
  <footer class="social-footer">
    <a href="https://wa.me/917745092723" target="_blank" class="btn-icon wa-bg" title="WhatsApp Support">
      <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
    </a>
    <a href="https://instagram.com/gauri_creations4" target="_blank" class="btn-icon ig-bg" title="Instagram Page">
      <svg viewBox="0 0 24 24"><path d="M7.8,2H16.2C19.4,2 22,4.6 22,7.8V16.2A5.8,5.8 0 0,1 16.2,22H7.8C4.6,22 2,19.4 2,16.2V7.8A5.8,5.8 0 0,1 7.8,2M7.6,4A3.6,3.6 0 0,0 4,7.6V16.4C4,18.39 5.61,20 7.6,20H16.4A3.6,3.6 0 0,0 20,16.4V7.6C20,5.61 18.39,4 16.4,4H7.6M17.25,5.5A1.25,1.25 0 0,1 18.5,6.75A1.25,1.25 0 0,1 17.25,8A1.25,1.25 0 0,1 16,6.75A1.25,1.25 0 0,1 17.25,5.5M12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9Z" fill="white"/></svg>
    </a>
  </footer>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration skipped'));
}

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyGE0vN4yxngAyqooJAnULrBQbbNc6kyluYSg7JgydWeJ5481HmsFxVgC8kCWBvE3Wq/exec";

let allProducts = [];
let activeCategory = 'All';

/* Menu Dropdown */
function toggleMenu() { 
  const m = document.getElementById("menuList"); 
  m.style.display = m.style.display === "block" ? "none" : "block"; 
}

/* User Session Control */
function initUserSession() {
  const customer = JSON.parse(localStorage.getItem("gc_customer") || "null");
  const authLink = document.getElementById("authLink");
  const subWelcome = document.getElementById("subWelcome");
  const welcomeText = document.getElementById("welcomeText");

  if (customer && customer.name) {
    subWelcome.textContent = `Hello, ${customer.name}`;
    welcomeText.textContent = `Welcome, ${customer.name}!`;
    authLink.textContent = "🚪 Logout";
    authLink.style.color = "#e11d48";
  } else {
    subWelcome.textContent = "Welcome";
    welcomeText.textContent = "Gauri Creations Store";
    authLink.textContent = "🔑 Login / Register";
    authLink.style.color = "#2563eb";
  }
}

function handleAuthClick() {
  const customer = localStorage.getItem("gc_customer");
  if (customer) {
    localStorage.removeItem("gc_customer");
    location.reload();
  } else {
    window.location.href = "login.html";
  }
}

function getWishlist() { 
  return JSON.parse(localStorage.getItem("gc_wishlist") || "[]"); 
}

function toggleWishlist(sku, el) {
  let list = getWishlist();
  if (list.includes(sku)) { 
    list = list.filter(s => s !== sku); 
    el.textContent = "🤍"; 
  } else { 
    list.push(sku); 
    el.textContent = "❤️"; 
  }
  localStorage.setItem("gc_wishlist", JSON.stringify(list));
}

/* Universal Image Normalizer */
function normalizeImageForThumb(url) {
  if (!url) return "";
  url = String(url).trim();
  if (url.includes("googleusercontent") || url.includes("gstatic.com") || url.startsWith('http')) {
    if (url.includes('=w') || url.includes('=s')) return url;
  }
  const m = url.match(/[-A-Za-z0-9_]+/g);
  if (m && m.length) {
    const candidate = m.reduce((a, b) => a.length > b.length ? a : b, "");
    if (candidate.length >= 20) return `https://lh3.googleusercontent.com/d/${candidate}=w600`;
  }
  return url;
}

function getImg(p) {
  let url = p["Image URL 1"] || p.imageUrl1 || p.Image || "";
  if (!url && p) {
    Object.keys(p).forEach(k => { 
      if (k.toLowerCase().includes("image") && p[k]) url = p[k]; 
    });
  }
  return normalizeImageForThumb(url) || "https://via.placeholder.com/400x300?text=Handcrafted+Decor";
}

/* HTML Escape */
function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* Load Catalog */
async function loadCatalog() {
  try {
    const res = await fetch(SCRIPT_URL + "?action=getProducts");
    const d = await res.json();

    allProducts = d.products || [];
    render(allProducts);
    setupCats();
    document.getElementById("summaryTotal").textContent = allProducts.length;
  } catch (err) {
    console.error("Failed to fetch catalog:", err);
    document.getElementById("grid").innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #e11d48;">Failed to load catalog. Please check your network connection.</div>';
  }
}

/* Setup Category Bar */
function setupCats() {
  const cats = ['All', ...new Set(allProducts.map(p => p.Category || p.category || 'Other'))];
  const bar = document.getElementById("categoryBar");
  bar.innerHTML = "";

  cats.forEach(c => {
    const d = document.createElement("div"); 
    d.className = `cat-chip ${c === 'All' ? 'active' : ''}`; 
    d.textContent = c;
    d.onclick = () => { 
      document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active')); 
      d.classList.add('active'); 
      activeCategory = c; 
      filter(); 
    };
    bar.appendChild(d);
  });
}

/* Filter Products */
function filter() {
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  const res = allProducts.filter(p => {
    const cat = p.Category || p.category || "Other";
    const name = (p.Name || p.name || "").toLowerCase();
    const sku = (p.SKU || p.sku || "").toLowerCase();
    return (activeCategory === 'All' || cat === activeCategory) && (name.includes(q) || sku.includes(q));
  });
  render(res);
}

/* Render Product Cards */
function render(list) {
  const grid = document.getElementById("grid");
  
  if (!list || list.length === 0) {
    grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #64748b; padding: 30px 0;">No products match your search or category filter.</div>';
    return;
  }

  const wl = getWishlist();
  let cardsHtml = "";

  list.forEach(p => {
    const sku = escapeHtml(p.SKU || p.sku || "");
    const name = escapeHtml(p.Name || p.name || "Handcrafted Item");
    const price = escapeHtml(p.Price || p.price || "0");
    const img = getImg(p);
    const liked = wl.includes(sku) ? "❤️" : "🤍";
    const ratingVal = p.Rating || p.rating || 0;
    
    const ratingHtml = ratingVal 
      ? `<span style="font-size:12px;color:#d97706;font-weight:700">★ ${ratingVal}</span>` 
      : `<span style="font-size:11px;color:#94a3b8;font-weight:600">New</span>`;
    
    cardsHtml += `
      <div class="product-card">
        <div class="product-img-wrap">
          <img src="${img}" class="product-img" alt="${name}" loading="lazy" onerror="this.src='https://via.placeholder.com/300?text=Handcrafted+Decor'">
          <div class="wish-btn" onclick="toggleWishlist('${sku}', this)">${liked}</div>
        </div>
        <strong style="font-size:14px; margin-top:4px; line-height:1.3;">${name}</strong>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
           <div style="font-weight:800; color:#e11d48; font-size:15px;">₹${price}</div>
           ${ratingHtml}
        </div>
        <button class="btn-primary" onclick="location.href='product.html?sku=${encodeURIComponent(sku)}'">Know More</button>
      </div>`;
  });

  grid.innerHTML = cardsHtml;
}

document.addEventListener("DOMContentLoaded", () => {
  initUserSession();
  loadCatalog();
});
</script>
</body>
</html>
