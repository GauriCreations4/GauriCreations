<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin • Manage Reviews | Gauri Creations</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="logo-gauri.jpeg">
<style>
  :root { --bg-grad: linear-gradient(135deg, #e3f2ff, #ffe5f3); --card-bg: rgba(255, 255, 255, 0.95); --border-color: rgba(148, 163, 184, 0.5); --shadow: 0 20px 40px rgba(0, 0, 0, 0.15); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-grad); min-height: 100vh; padding: 18px 18px calc(100px + env(safe-area-inset-bottom)) 18px; display: flex; justify-content: center; color: #0f172a; }
  .shell { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 16px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-radius: 20px; background: var(--card-bg); border: 1px solid var(--border-color); box-shadow: var(--shadow); flex-wrap: wrap; gap: 10px; }
  .top-title { font-size: 18px; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 8px; }
  .pill-btn { padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(148,163,184,0.8); background: #fff; cursor: pointer; text-decoration: none; color: #0f172a; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; }
  .container { background: var(--card-bg); padding: 20px; border-radius: 22px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
  .status-text { font-size: 13px; color: #64748b; margin-bottom: 12px; font-weight: 500; }
  .table-wrapper { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 12px 10px; border-bottom: 1px solid #e2e8f0; text-align: left; vertical-align: middle; }
  th { background: #f8fafc; color: #475569; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .badge { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #fef08a; color: #854d0e; display: inline-block; }
  .btn { padding: 6px 14px; border: none; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.2s; }
  .btn-delete { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  .btn-delete:hover { background: #ef4444; color: #ffffff; }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="top-title">⭐ Manage Reviews & Ratings</div>
    <div style="display: flex; gap: 8px;">
      <a href="admin-manage-products.html" class="pill-btn">📦 Products</a>
      <a href="admin.html" class="pill-btn">🏠 Dashboard</a>
    </div>
  </header>
  <div class="container">
    <div id="statusText" class="status-text">Loading reviews live from Google Sheets...</div>
    <div class="table-wrapper">
      <table id="reviewsTable">
        <thead>
          <tr>
            <th>Review ID</th>
            <th>Product SKU</th>
            <th>Customer</th>
            <th>Rating</th>
            <th>Comment</th>
            <th style="width: 100px;">Action</th>
          </tr>
        </thead>
        <tbody><tr><td colspan="6" style="text-align: center; color: #94a3b8;">Loading data...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx43-uKrZ24dIGMPIMzZduM01QejA2l5kd3Kwgb2bQ30EqAKMmfbWp-KsEJEaTW90qI/exec";
async function callAppsScript(payload) {
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  return await res.json();
}
function escapeHtml(str) { if (!str) return "-"; return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
async function loadReviews() {
  const statusEl = document.getElementById("statusText"); statusEl.textContent = "Loading reviews...";
  try {
    const res = await fetch(SCRIPT_URL + "?action=getReviews&all=1"); const data = await res.json();
    if (!data.success) throw new Error(data.message || "Failed to fetch reviews");
    const tbody = document.querySelector("#reviewsTable tbody"); tbody.innerHTML = "";
    const reviews = data.reviews || [];
    if (reviews.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #94a3b8;">No customer reviews submitted yet.</td></tr>'; statusEl.textContent = "0 reviews found."; return; }
    reviews.reverse().forEach(r => {
      const tr = document.createElement("tr");
      const reviewId = escapeHtml(r["Review ID"]); const sku = escapeHtml(r["Product SKU"]); const customer = escapeHtml(r["Customer ID"] || r["name"]); const rating = escapeHtml(r["Rating"]); const comment = escapeHtml(r["Comment"]);
      tr.innerHTML = `<td><strong>${reviewId}</strong></td><td>${sku}</td><td>${customer}</td><td><span class="badge">★ ${rating}</span></td><td>${comment}</td><td><button class="btn btn-delete" onclick="deleteReview('${reviewId}', '${sku}', this)">Delete</button></td>`;
      tbody.appendChild(tr);
    });
    statusEl.textContent = `Displaying ${reviews.length} customer review(s).`;
  } catch (err) { console.error(err); document.getElementById("statusText").textContent = "Error loading reviews: " + err.message; document.querySelector("#reviewsTable tbody").innerHTML = '<tr><td colspan="6" style="text-align: center; color: #e11d48;">Failed to load reviews.</td></tr>'; }
}
async function deleteReview(reviewId, sku, btnElement) {
  if (!confirm(`Delete review ${reviewId} permanently?`)) return;
  btnElement.disabled = true; btnElement.textContent = "Deleting...";
  try {
    const data = await callAppsScript({ action: "deleteReview", reviewId: reviewId, sku: sku });
    if (data.success) { alert("Review deleted successfully ✔ Rating updated."); loadReviews(); }
    else { throw new Error(data.message || "Failed to delete review."); }
  } catch (err) { console.error(err); alert("Error deleting review: " + err.message); btnElement.disabled = false; btnElement.textContent = "Delete"; }
}
document.addEventListener("DOMContentLoaded", loadReviews);
</script>
</body>
</html>
