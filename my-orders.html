<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Orders • Gauri Creations</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="logo-gauri.jpeg">
<style>
  :root { --bg-grad: linear-gradient(135deg, #e3f2ff, #ffe5f3); --card-bg: rgba(255, 255, 255, 0.92); --primary-blue: #2563eb; --accent-pink: #ec4899; --shadow: 0 4px 15px rgba(0, 0, 0, 0.08); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 20px calc(80px + env(safe-area-inset-bottom)) 20px; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-grad); min-height: 100vh; display: flex; justify-content: center; color: #0f172a; }
  .container { width: 100%; max-width: 800px; }
  .top-header { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 10px 16px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.6); }
  .brand-logo { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; }
  .header-actions { display: flex; align-items: center; gap: 10px; position: relative; }
  .cart-icon-btn { position: relative; background: rgba(255, 255, 255, 0.9); border: 1px solid #cbd5e1; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08); }
  .cart-badge { position: absolute; top: -4px; right: -4px; background: #e11d48; color: #ffffff; font-size: 11px; font-weight: 800; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(225, 29, 72, 0.4); }
  .menu-btn { background: linear-gradient(135deg, #2563eb, #ec4899); padding: 8px 16px; border-radius: 999px; color: #ffffff; font-weight: 700; cursor: pointer; border: none; font-size: 13px; }
  .menu-box { position: absolute; top: 50px; right: 0; background: #ffffff; border-radius: 16px; width: 170px; padding: 6px 0; box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2); display: none; z-index: 200; border: 1px solid #e2e8f0; }
  .menu-item { padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
  .menu-item:last-child { border-bottom: none; }
  h2 { text-align: center; color: #0f172a; margin-bottom: 20px; font-size: 22px; font-weight: 800; }
  .order-card { background: var(--card-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 18px; padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid rgba(255, 255, 255, 0.7); }
  .order-header { display: flex; justify-content: space-between; font-weight: 800; color: var(--primary-blue); margin-bottom: 8px; font-size: 15px; }
  .order-detail { font-size: 14px; color: #475569; margin-bottom: 4px; }
  .status-badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 11px; background: #e0f2fe; color: #0284c7; font-weight: 700; margin-top: 8px; }
  .btn-review { display: block; width: 100%; text-align: center; margin-top: 12px; padding: 10px; background: linear-gradient(135deg, var(--primary-blue), var(--accent-pink)); color: white; text-decoration: none; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; border: none; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); z-index: 1000; padding: 16px; }
  .modal { background: #ffffff; padding: 25px; border-radius: 24px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
  textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 12px; margin: 12px 0; font-family: inherit; font-size: 13px; outline: none; }
  textarea:focus { border-color: var(--primary-blue); }
  .star-rating { font-size: 32px; cursor: pointer; color: #cbd5e1; user-select: none; margin: 8px 0; }
  .star-rating span.active { color: #f59e0b; }
  .back-link { display: block; text-align: center; margin-top: 24px; color: #64748b; text-decoration: none; font-weight: 700; font-size: 14px; }
  .back-link:hover { color: var(--primary-blue); }
</style>
</head>
<body>
<div class="container">
  <div class="top-header">
    <div style="display: flex; align-items: center; gap: 10px; cursor: pointer;" onclick="location.href='store.html'">
       <span style="font-size: 18px; font-weight: bold;">←</span>
       <img src="logo-gauri.jpeg" class="brand-logo" alt="Gauri Creations" onerror="this.src='https://via.placeholder.com/38?text=GC'">
       <div style="font-weight: 800; font-size: 15px;">Gauri Creations</div>
    </div>
    <div class="header-actions">
      <button class="cart-icon-btn" onclick="location.href='order.html'" title="View Cart">
        🛒
        <span class="cart-badge" id="cartCount">0</span>
      </button>
      <button class="menu-btn" onclick="toggleMenu()">≡ Menu</button>
      <div id="menuBox" class="menu-box">
        <div class="menu-item" onclick="location.href='store.html'">🏠 Home</div>
        <div class="menu-item" onclick="location.href='track.html'">📦 Track Order</div>
        <div class="menu-item" onclick="location.href='my-orders.html'">🧾 My Orders</div>
      </div>
    </div>
  </div>

  <h2>📦 My Orders</h2>
  <div id="loading" style="text-align:center; color:#64748b; font-weight:500;">Loading your orders...</div>
  <div id="ordersList"></div>
  <a href="store.html" class="back-link">← Back to Store</a>
</div>

<div class="modal-overlay" id="reviewModal">
  <div class="modal">
    <h3 style="margin: 0 0 8px 0;">Rate Product</h3>
    <div class="star-rating" id="stars">
      <span onclick="setRate(1)">★</span><span onclick="setRate(2)">★</span><span onclick="setRate(3)">★</span><span onclick="setRate(4)">★</span><span onclick="setRate(5)">★</span>
    </div>
    <textarea id="reviewText" rows="3" placeholder="Write your feedback..."></textarea>
    <button class="btn-review" onclick="submitReview()">Submit Review</button>
    <button style="background:transparent; border:none; color:#64748b; margin-top:12px; cursor:pointer; font-weight:600; font-size:13px;" onclick="closeModal()">Cancel</button>
  </div>
</div>
<div class="modal-overlay" id="successModal">
  <div class="modal">
    <div style="font-size: 48px; margin-bottom: 10px;">🎉</div>
    <h3 style="margin: 0 0 8px 0;">Thank You!</h3>
    <p style="font-size:14px; color:#475569; margin-bottom:16px;">Your review has been submitted successfully.</p>
    <button class="btn-review" onclick="document.getElementById('successModal').style.display='none'">Close</button>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx43-uKrZ24dIGMPIMzZduM01QejA2l5kd3Kwgb2bQ30EqAKMmfbWp-KsEJEaTW90qI/exec";
const user = JSON.parse(localStorage.getItem("gc_customer") || "null");

if (!user) { window.location.href = "login.html"; }

function toggleMenu() { const b = document.getElementById("menuBox"); b.style.display = b.style.display === "block" ? "none" : "block"; }

function updateCartBadge() {
  const cart = JSON.parse(localStorage.getItem("gc_cart") || "[]");
  const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
  const badge = document.getElementById("cartCount");
  if (badge) badge.textContent = totalItems;
}

async function callAppsScript(payload) {
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

function escapeHtml(str) { if (!str) return ""; return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }

function formatDate(ts) { if (!ts) return "N/A"; const str = String(ts); if (str.includes("T")) return str.split("T")[0]; const d = new Date(ts); if (!isNaN(d.getTime())) return d.toISOString().split("T")[0]; return str; }

async function loadMyOrders() {
  const loadingEl = document.getElementById("loading"); const listEl = document.getElementById("ordersList");
  try {
    const res = await fetch(SCRIPT_URL + "?action=listOrders");
    const data = await res.json();
    loadingEl.style.display = "none";
    if (!data.success || !data.orders) { listEl.innerHTML = "<p style='text-align:center; color:#64748b;'>Failed to load orders.</p>"; return; }
    const myOrders = data.orders.filter(o => (user.phone && String(o["Phone"]) === String(user.phone)) || (user.name && String(o["Customer Name"]).toLowerCase() === String(user.name).toLowerCase()));
    if (myOrders.length === 0) { listEl.innerHTML = "<p style='text-align:center; color:#64748b;'>No orders placed yet.</p>"; return; }
    let cardsHtml = "";
    myOrders.reverse().forEach(o => {
      const orderId = escapeHtml(o["Order ID"]); const total = escapeHtml(o["Total"]); const prodName = escapeHtml(o["Product Name"]); const status = escapeHtml(o["Status"] || "Order Received"); const sku = escapeHtml(o["Product SKU"] || ""); const date = formatDate(o["Timestamp"]);
      cardsHtml += `<div class="order-card"><div class="order-header"><span>#${orderId}</span><span>₹${total}</span></div><div class="order-detail"><strong>Product:</strong> ${prodName}</div><div class="order-detail"><strong>Date:</strong> ${date}</div><div class="status-badge">${status}</div><button class="btn-review" onclick="openReview('${sku}', '${prodName}')">★ Rate & Review</button></div>`;
    });
    listEl.innerHTML = cardsHtml;
  } catch (err) { console.error(err); loadingEl.style.display = "none"; listEl.innerHTML = "<p style='text-align:center; color:#e11d48;'>Network error. Please try again later.</p>"; }
}

let currentSku = null; let currentRating = 0;
function openReview(sku, name) { currentSku = sku; currentRating = 0; updateStars(); document.getElementById("reviewText").value = ""; document.getElementById("reviewModal").style.display = "flex"; }
function setRate(n) { currentRating = n; updateStars(); }
function updateStars() { const stars = document.querySelectorAll("#stars span"); stars.forEach((s, i) => { s.className = i < currentRating ? "active" : ""; }); }
function closeModal() { document.getElementById("reviewModal").style.display = "none"; }

async function submitReview() {
  const text = document.getElementById("reviewText").value.trim();
  if (currentRating === 0) { alert("Please tap a star to set a rating."); return; }
  const btn = document.querySelector("#reviewModal .btn-review"); const originalText = btn.textContent; btn.disabled = true; btn.textContent = "Submitting...";
  try {
    await callAppsScript({ action: "submitReview", sku: currentSku, rating: currentRating, comment: text, customerName: user.name || "Customer" });
    closeModal(); document.getElementById("successModal").style.display = "flex";
  } catch (err) { console.error(err); alert("Failed to submit review: " + err.message); }
  finally { btn.disabled = false; btn.textContent = originalText; }
}

document.addEventListener("DOMContentLoaded", () => {
  updateCartBadge();
  loadMyOrders();
});
</script>
</body>
</html>
