<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Seller Hub • Shipping & Fulfillment | Gauri Creations</title>

<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="logo-gauri.jpeg">

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  :root {
    --bg-grad: linear-gradient(135deg, #e3f2ff, #ffe5f3);
    --card-bg: rgba(255, 255, 255, 0.95);
    --border-color: rgba(148, 163, 184, 0.5);
    --shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
  }

  * { box-sizing: border-box; }

  body { 
    margin: 0; 
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: var(--bg-grad); 
    padding: 18px 18px calc(100px + env(safe-area-inset-bottom)) 18px; 
    display: flex;
    justify-content: center;
    min-height: 100vh;
    color: #0f172a;
  }

  .shell { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 16px; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-radius: 20px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow);
    flex-wrap: wrap;
    gap: 10px;
  }

  .top-title {
    font-size: 18px;
    font-weight: 700;
    color: #0f172a;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pill-btn {
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(148,163,184,0.8);
    background: #fff;
    cursor: pointer;
    text-decoration: none;
    color: #0f172a;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    font-size: 13px;
  }

  .container { 
    background: var(--card-bg); 
    padding: 20px; 
    border-radius: 22px; 
    box-shadow: var(--shadow); 
    border: 1px solid var(--border-color);
  }

  .status-text { font-size: 13px; color: #64748b; margin-bottom: 12px; font-weight: 500; }
  .table-wrapper { width: 100%; overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 700px; }
  th, td { padding: 12px 10px; border-bottom: 1px solid #e2e8f0; text-align: left; vertical-align: middle; }
  th { background: #f8fafc; color: #475569; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }

  select, input { padding: 6px 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 13px; outline: none; }

  .btn { padding: 6px 14px; border: none; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
  .btn-primary { background: linear-gradient(135deg, #2563eb, #ec4899); color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
  .btn-support { background: #16a34a; color: #fff; }

  #printArea { display: none; }

  @media print {
    @page { size: auto; margin: 0mm; }
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea {
      display: block;
      position: absolute;
      left: 0; top: 0;
      width: 100%;
      background: white;
      color: black;
      font-family: Arial, sans-serif;
      padding: 10px;
    }
    
    .label-page {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      border: 2px solid #000;
      page-break-after: always;
    }

    .courier-header { display: flex; border-bottom: 2px solid #000; min-height: 200px; }
    .qr-box { width: 150px; padding: 10px; border-right: 2px solid #000; display: flex; align-items: center; justify-content: center; }
    .address-box { flex: 1; padding: 10px; font-size: 12px; line-height: 1.4; }
    .routing-codes { margin-top: 10px; font-weight: bold; font-size: 14px; border: 1px solid #000; padding: 5px; text-align: center; }
    .large-code { font-size: 22px; font-weight: 900; margin-top: 4px; }

    .product-summary { padding: 10px; border-bottom: 2px solid #000; }
    .mini-table { width: 100%; font-size: 11px; border-collapse: collapse; }
    .mini-table th, .mini-table td { border: 1px solid #000; padding: 4px; text-align: left; }
    .mini-table th { background: #eee; }

    .invoice-section { padding: 15px; }
    .invoice-header { text-align: center; font-weight: bold; text-decoration: underline; margin-bottom: 10px; }
    .invoice-details { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 12px; }
    .invoice-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 15px; }
    .invoice-table th, .invoice-table td { border: 1px solid #000; padding: 6px; text-align: left; }
    .footer-note { font-size: 10px; font-style: italic; }
  }
</style>
</head>

<body>

<div class="shell">
  <header class="topbar">
    <div class="top-title">🚚 Seller Hub – Shipping & Fulfillment</div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <a href="admin-order.html" class="pill-btn">📋 Orders</a>
      <a href="admin-manage-products.html" class="pill-btn">📦 Products</a>
      <a href="admin.html" class="pill-btn">🏠 Dashboard</a>
    </div>
  </header>

  <div class="container">
    <div id="statusText" class="status-text">Loading paid orders live from Google Sheets...</div>

    <div class="table-wrapper">
      <table id="ordersTable">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer Name</th>
            <th>Fulfillment Status</th>
            <th>AWB / Tracking</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="5" style="text-align: center; color: #94a3b8;">Loading orders...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="printArea"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx43-uKrZ24dIGMPIMzZduM01QejA2l5kd3Kwgb2bQ30EqAKMmfbWp-KsEJEaTW90qI/exec";

let globalOrders = [];
const STATUS_FLOW = ["Packing", "Shipped", "Out for Delivery", "Delivered"];

async function callAppsScript(payload) {
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function loadOrders() {
  const statusEl = document.getElementById("statusText");
  statusEl.textContent = "Fetching orders...";

  try {
    const res = await fetch(SCRIPT_URL + "?action=listOrders");
    const data = await res.json();

    if (!data.success) throw new Error(data.message || "Failed to load orders");

    globalOrders = data.orders || [];
    const tbody = document.querySelector("#ordersTable tbody");
    tbody.innerHTML = "";

    const paidOrders = globalOrders.filter(o => 
      String(o["Payment Status"] || o["paymentStatus"] || "").toLowerCase() === "paid"
    );

    if (paidOrders.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #94a3b8;">No paid orders awaiting fulfillment.</td></tr>';
      statusEl.textContent = "0 orders found.";
      return;
    }

    paidOrders.reverse().forEach(o => {
      const tr = document.createElement("tr");
      const orderId = escapeHtml(o["Order ID"] || o["orderId"]);
      const custName = escapeHtml(o["Customer Name"] || o["name"]);
      const phone = escapeHtml(o["Phone"] || o["phone"]);
      const currentStatus = o["Status"] || o["status"] || "Packing";
      const awb = escapeHtml(o["AWB"] || o["awb"] || "");

      tr.innerHTML = `
        <td><b>#${orderId}</b><br><small style="color:#64748b;">${escapeHtml(o["Timestamp"] || "")}</small></td>
        <td>${custName}<br><small style="color:#64748b;">${phone}</small></td>
        <td>
          <select onchange="updateOrder('${orderId}','status',this.value)">
            ${STATUS_FLOW.map(s => `<option value="${s}" ${currentStatus === s ? "selected" : ""}>${s}</option>`).join("")}
          </select>
        </td>
        <td>
          <input style="width:120px" placeholder="AWB Number" value="${awb}" 
                 onchange="updateOrder('${orderId}','awb',this.value)">
        </td>
        <td>
          <button class="btn btn-primary" onclick="printLabel('${orderId}')">
            🖨️ Label
          </button>
          <button class="btn btn-support" onclick="support('${phone}')" style="margin-left: 4px;">
            💬 Chat
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    statusEl.textContent = `Displaying ${paidOrders.length} paid order(s) for fulfillment.`;

  } catch (err) {
    console.error(err);
    document.getElementById("statusText").textContent = "Error loading orders: " + err.message;
  }
}

function printLabel(orderId) {
  const order = globalOrders.find(o => String(o["Order ID"] || o["orderId"]) === String(orderId));
  if (!order) return alert("Order data not found!");

  const price = parseFloat(order["Price"] || order["price"] || 0);
  const qty = parseInt(order["Qty"] || order["qty"] || 1);
  const total = order["Total Amount"] || order["Total"] || order["total"] || (price * qty);
  const pincode = order["Pincode"] || order["pincode"] || order["Pin"] || "";
  const address = order["Address"] || order["address"] || "Shipping address on file";
  
  const routingCode = `MH/${String(pincode).substring(0, 3)}/${Math.floor(Math.random() * 90) + 10}`;

  const printDiv = document.getElementById("printArea");
  
  printDiv.innerHTML = `
    <div class="label-page">
      <div class="courier-header">
        <div class="qr-box" id="qrcode-${orderId}"></div>
        <div class="address-box">
          <div style="font-weight:bold; font-size:13px; margin-bottom:4px">DELIVER TO:</div>
          <div style="font-size:15px; font-weight:bold">${escapeHtml(order["Customer Name"] || order["name"])}</div>
          <div>${escapeHtml(address)}</div>
          <div>${pincode ? escapeHtml(pincode) + "," : ""} Maharashtra</div>
          <div style="margin-top:6px"><b>Mobile:</b> ${escapeHtml(order["Phone"] || order["phone"])}</div>
          
          <div class="routing-codes">
             <div>COD: PREPAID</div>
             <div class="large-code">${routingCode}</div>
             <div>Standard Delivery</div>
          </div>
        </div>
      </div>

      <div class="product-summary">
        <b>Package Contents:</b>
        <table class="mini-table" style="margin-top:5px">
           <tr>
             <th>SKU / Product</th>
             <th>Qty</th>
             <th>Type</th>
           </tr>
           <tr>
             <td>${escapeHtml(order["Product Name"] || order["product"] || "Handcrafted Item")}</td>
             <td>${qty}</td>
             <td>Fragile / Decor</td>
           </tr>
        </table>
        <div style="text-align:center; margin-top:10px">
           <svg id="barcode-${orderId}"></svg>
        </div>
      </div>

      <div class="invoice-section">
         <div class="invoice-header">TAX INVOICE / BILL OF SUPPLY</div>
         
         <div class="invoice-details">
            <div>
               <b>Sold By:</b><br>
               Gauri Creations Pvt Ltd<br>
               Vasai Virar, Maharashtra 401208<br>
               GSTIN: 27ABCDE1234F1Z5
            </div>
            <div style="text-align:right">
               <b>Order ID:</b> ${escapeHtml(orderId)}<br>
               <b>Invoice Date:</b> ${new Date().toLocaleDateString()}<br>
               <b>Payment:</b> Online / Paid
            </div>
         </div>

         <table class="invoice-table">
            <tr>
               <th>Description</th>
               <th>Qty</th>
               <th>Rate</th>
               <th>Tax</th>
               <th>Total</th>
            </tr>
            <tr>
               <td>${escapeHtml(order["Product Name"] || order["product"] || "Item")}</td>
               <td>${qty}</td>
               <td>₹${price}</td>
               <td>0%</td>
               <td>₹${total}</td>
            </tr>
            <tr>
               <td colspan="4" style="text-align:right"><b>Grand Total:</b></td>
               <td><b>₹${total}</b></td>
            </tr>
         </table>
         
         <div class="footer-note">
           * This is a computer generated invoice and does not require a physical signature.<br>
           * Returns valid only for damaged products with unboxing video.
         </div>
      </div>
    </div>
  `;

  new QRCode(document.getElementById(`qrcode-${orderId}`), {
    text: `${orderId} | ${order["Customer Name"] || order["name"]} | ₹${total}`,
    width: 120,
    height: 120
  });

  JsBarcode(`#barcode-${orderId}`, String(orderId), {
    format: "CODE128",
    height: 38,
    displayValue: true
  });

  setTimeout(() => window.print(), 500);
}

async function updateOrder(orderId, field, value) {
  try {
    const data = await callAppsScript({
      action: "updateOrderStatus",
      orderId: orderId,
      [field]: value
    });

    if (!data.success) {
      throw new Error(data.message || "Failed to update order");
    }
  } catch (err) {
    console.error("Order update failed:", err);
    alert("Error updating order: " + err.message);
  }
}

function support(phone) {
  const cleanPhone = String(phone).replace(/\D/g, "");
  window.open(`https://wa.me/91${cleanPhone}`);
}

document.addEventListener("DOMContentLoaded", loadOrders);
</script>

</body>
</html>
