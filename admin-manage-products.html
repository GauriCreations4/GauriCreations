<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Manage Products • Gauri Creations Admin</title>

<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="logo-gauri.jpeg">

<style>
  :root{
    --bg-grad: linear-gradient(135deg,#86e1ff,#ffd4b8);
    --glass-bg: rgba(255,255,255,0.96);
    --glass-border: rgba(148,163,184,0.6);
    --shadow-strong: 0 22px 60px rgba(15,23,42,0.30);
    --muted: #6b7280;
    --accent-grad: linear-gradient(135deg,#2563eb,#ec4899);
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-grad);
    padding: 18px 18px calc(100px + env(safe-area-inset-bottom)) 18px;
    color:#0f172a;
    display:flex;
    justify-content:center;
  }

  .shell{ width:100%; max-width:1200px; }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    border-radius:22px;
    background: var(--glass-bg);
    border:1px solid var(--glass-border);
    box-shadow: var(--shadow-strong);
    margin-bottom:14px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .top-left{ display:flex; gap:12px; align-items:center; }
  .logo{ width:48px; height:48px; border-radius:12px; object-fit:cover; }
  .title-main{ font-size:18px; font-weight:800; }
  .subtitle{ font-size:12px; color:var(--muted); }

  .top-right { display:flex; align-items:center; gap:8px; flex-wrap: wrap; }
  .top-right .group{ display:flex; gap:8px; align-items:center; }
  .pill-btn{
    padding:8px 14px;
    border-radius:999px;
    border:1px solid rgba(148,163,184,0.8);
    background:#fff;
    cursor:pointer; text-decoration:none; color:#0f172a;
    display:inline-flex; gap:6px; align-items:center; font-weight:700;
    font-size: 13px;
  }
  .pill-btn.primary{ background:var(--accent-grad); color:#fff; border:none; box-shadow:0 6px 18px rgba(37,99,235,0.2); }

  .card{
    border-radius:22px;
    background: var(--glass-bg);
    border:1px solid rgba(148,163,184,0.6);
    padding:16px;
    box-shadow: var(--shadow-strong);
  }

  .card-header{ display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .card-title{ font-size:16px; font-weight:800; }
  .card-sub{ font-size:12px; color:var(--muted); }

  .filters{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .search-input{ padding:8px 14px; border-radius:999px; border:1px solid #cbd5e1; min-width:200px; font-size:13px; outline:none; }

  table.products-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .products-table th, .products-table td { padding:10px 8px; border-bottom:1px solid #e5e7eb; text-align:left; vertical-align:middle; }
  .products-table th{ font-size:11px; text-transform:uppercase; color:var(--muted); letter-spacing:0.02em; }

  .thumb-cell{ width:72px; }
  .thumb-img{
    width:56px;
    height:56px;
    border-radius:10px;
    object-fit:cover;
    display:block;
    box-shadow:0 4px 10px rgba(15,23,42,0.1);
  }

  .cards-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap:14px;
    margin-top:14px;
  }
  .product-fcard{
    border-radius:16px;
    background:#ffffff;
    padding:12px;
    box-shadow:0 10px 25px rgba(15,23,42,0.08);
    display:flex;
    flex-direction:column;
    gap:8px;
    border: 1px solid #e2e8f0;
  }
  .fcard-img{ width:100%; height:150px; border-radius:12px; object-fit:cover; background:#f8fafc; display:block; }
  .fcard-title{ font-weight:700; font-size:14px; }
  .fcard-price{ font-weight:800; color:#e11d48; font-size:15px; }
  .fcard-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; }

  .fcard-actions{ display:flex; gap:8px; margin-top:auto; }
  .btn-small{ padding:6px 12px; border-radius:999px; font-size:12px; border:1px solid #d1d5db; background:#fff; cursor:pointer; font-weight:700; }

  #editOverlay{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(15,23,42,0.7); z-index:60; padding:16px; }
  .edit-box{ width:100%; max-width:760px; max-height:90vh; overflow-y:auto; background:#fff; border-radius:22px; padding:20px; box-shadow: var(--shadow-strong); }

  @media (max-width:820px){
    .desktop-table{ display:none; }
  }
  @media (min-width:821px){
    .desktop-table{ display:block; }
  }

  .muted{ color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="shell" id="adminMain" style="display:none;">

  <header class="topbar">
    <div class="top-left">
      <img src="logo-gauri.jpeg" alt="Gauri Creations" class="logo" onerror="this.src='https://via.placeholder.com/48?text=GC'" />
      <div>
        <div class="title-main">Manage Products</div>
        <div class="subtitle">Edit images, stock & product details</div>
      </div>
    </div>

    <div class="top-right">
      <div class="group">
        <a href="admin-add-product.html" class="pill-btn primary">➕ Add Product</a>
        <a href="admin.html" class="pill-btn">🏠 Dashboard</a>
      </div>
      <button onclick="adminLogout()" class="pill-btn">🔒 Logout</button>
    </div>
  </header>

  <section class="card">
    <div class="card-header">
      <div>
        <div class="card-title">Product Catalog</div>
        <div class="card-sub">Data synchronized live with Google Sheets</div>
      </div>

      <div class="filters">
        <input id="searchInput" class="search-input" placeholder="Search product name or SKU..." />
        <select id="filterCategory" class="pill-btn" style="min-width:130px;">
          <option value="">All Categories</option>
        </select>
        <select id="filterStock" class="pill-btn" style="min-width:130px;">
          <option value="">All Stock</option>
          <option value="in">In Stock (> 0)</option>
          <option value="low">Low Stock (≤ 5)</option>
          <option value="out">Out of Stock</option>
        </select>
      </div>
    </div>

    <div id="statusText" class="muted" style="margin-bottom:8px;">Loading products…</div>

    <!-- Desktop Table View -->
    <div class="desktop-table">
      <table class="products-table">
        <thead>
          <tr>
            <th></th>
            <th>SKU</th>
            <th>Name</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Category</th>
            <th>Rating</th>
            <th style="width:140px">Actions</th>
          </tr>
        </thead>
        <tbody id="productsTableBody"><tr><td colspan="8">Loading…</td></tr></tbody>
      </table>
    </div>

    <!-- Mobile Card View -->
    <div class="cards-grid" id="cardsGrid"></div>
  </section>

</div>

<!-- EDIT PRODUCT MODAL -->
<div id="editOverlay">
  <div class="edit-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 id="editTitle" style="margin:0;font-size:16px;">Edit Product</h3>
      <button onclick="closeEdit()" style="border:none;background:transparent;font-size:24px;cursor:pointer;">×</button>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px;">
      <div>
        <div style="margin-bottom:8px;">
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px;">SKU</label>
          <input id="editSku" style="width:100%;padding:8px;border-radius:8px;border:1px solid #cbd5e1;background:#f1f5f9" disabled />
        </div>
        <div style="margin-bottom:8px;">
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px;">Product Name</label>
          <input id="editName" style="width:100%;padding:8px;border-radius:8px;border:1px solid #cbd5e1" />
        </div>
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <div style="flex:1">
            <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px;">Price (₹)</label>
            <input id="editPrice" type="number" style="width:100%;padding:8px;border-radius:8px;border:1px solid #cbd5e1" />
          </div>
          <div style="width:120px">
            <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px;">Stock</label>
            <input id="editStock" type="number" style="width:100%;padding:8px;border-radius:8px;border:1px solid #cbd5e1" />
          </div>
        </div>
        <div>
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px;">Description</label>
          <textarea id="editDesc" style="width:100%;padding:8px;border-radius:8px;border:1px solid #cbd5e1" rows="4"></textarea>
        </div>
      </div>

      <div>
        <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:6px;">Product Image Slots</label>
        <div style="display:flex;flex-direction:column;gap:10px;">
          
          <!-- Slot 1 -->
          <div style="display:flex;gap:8px;align-items:center;">
            <div style="width:50px;height:50px;border-radius:8px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #cbd5e1;">
              <img id="previewImg1" src="" style="display:none;width:100%;height:100%;object-fit:cover;">
              <span id="placeholder1">🖼️</span>
            </div>
            <div style="flex:1;">
              <input id="editImg1" type="text" placeholder="Image URL 1" style="width:100%;padding:6px;border-radius:6px;border:1px solid #cbd5e1;margin-bottom:4px;font-size:12px;" />
              <div style="display:flex;gap:6px;">
                <label class="btn-small" style="cursor:pointer;display:inline-flex;align-items:center;">
                  Upload <input type="file" accept="image/*" style="display:none" onchange="handleImageUpload(event,1)">
                </label>
                <button class="btn-small" onclick="clearImageField(1)">Clear</button>
              </div>
            </div>
          </div>

          <!-- Slot 2 -->
          <div style="display:flex;gap:8px;align-items:center;">
            <div style="width:50px;height:50px;border-radius:8px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #cbd5e1;">
              <img id="previewImg2" src="" style="display:none;width:100%;height:100%;object-fit:cover;">
              <span id="placeholder2">🖼️</span>
            </div>
            <div style="flex:1;">
              <input id="editImg2" type="text" placeholder="Image URL 2" style="width:100%;padding:6px;border-radius:6px;border:1px solid #cbd5e1;margin-bottom:4px;font-size:12px;" />
              <div style="display:flex;gap:6px;">
                <label class="btn-small" style="cursor:pointer;display:inline-flex;align-items:center;">
                  Upload <input type="file" accept="image/*" style="display:none" onchange="handleImageUpload(event,2)">
                </label>
                <button class="btn-small" onclick="clearImageField(2)">Clear</button>
              </div>
            </div>
          </div>

          <!-- Slot 3 -->
          <div style="display:flex;gap:8px;align-items:center;">
            <div style="width:50px;height:50px;border-radius:8px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #cbd5e1;">
              <img id="previewImg3" src="" style="display:none;width:100%;height:100%;object-fit:cover;">
              <span id="placeholder3">🖼️</span>
            </div>
            <div style="flex:1;">
              <input id="editImg3" type="text" placeholder="Image URL 3" style="width:100%;padding:6px;border-radius:6px;border:1px solid #cbd5e1;margin-bottom:4px;font-size:12px;" />
              <div style="display:flex;gap:6px;">
                <label class="btn-small" style="cursor:pointer;display:inline-flex;align-items:center;">
                  Upload <input type="file" accept="image/*" style="display:none" onchange="handleImageUpload(event,3)">
                </label>
                <button class="btn-small" onclick="clearImageField(3)">Clear</button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;">
      <span id="editStatus" style="font-size:12px;color:var(--muted)">Modify details and click Update Product.</span>
      <div>
        <button class="btn-small" onclick="closeEdit()">Cancel</button>
        <button id="saveEditBtn" class="btn-small" style="background:#16a34a;color:#fff;border:none;margin-left:6px;">Update Product</button>
      </div>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx43-uKrZ24dIGMPIMzZduM01QejA2l5kd3Kwgb2bQ30EqAKMmfbWp-KsEJEaTW90qI/exec";
const ADMIN_FLAG = "gc_admin_auth";

let ALL_PRODUCTS = [];
let CURRENT_EDIT_PRODUCT = null;

async function callAppsScript(payload) {
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

function normalizeImageForThumb(url){
  if(!url) return "";
  url = String(url).trim();
  if(url.includes("googleusercontent") || url.includes("gstatic.com") || url.startsWith('http')) {
    if(url.includes('=w') || url.includes('=s')) return url;
  }
  const m = url.match(/[-A-Za-z0-9_]+/g);
  if(m && m.length){
    const candidate = m.reduce((a,b)=> a.length>b.length ? a : b, "");
    if(candidate.length >= 20) return `https://lh3.googleusercontent.com/d/${candidate}=w600`;
  }
  return url;
}

function initAdminLogin(){
  if(localStorage.getItem(ADMIN_FLAG) === "yes"){
    document.getElementById("adminMain").style.display = "block";
    reloadProducts();
  } else {
    const pin = prompt("Enter admin PIN:");
    if(pin === "3105"){ 
      localStorage.setItem(ADMIN_FLAG,"yes"); 
      document.getElementById("adminMain").style.display="block"; 
      reloadProducts(); 
    } else { 
      alert("Invalid PIN"); 
      window.location.href="admin.html"; 
    }
  }
}

function adminLogout(){ 
  localStorage.removeItem(ADMIN_FLAG); 
  window.location.href = "admin.html"; 
}

async function reloadProducts(){
  document.getElementById("statusText").textContent = "Loading catalog from sheet…";
  try{
    const res = await fetch(SCRIPT_URL + "?action=getProducts");
    const data = await res.json();
    const raw = data.products || [];

    const map = new Map();
    raw.forEach(p => {
      const sku = (p["SKU"] || "").toString().trim();
      if(!sku) return;
      if(!map.has(sku)) map.set(sku, p);
    });
    ALL_PRODUCTS = Array.from(map.values());

    populateCategoryFilter();
    renderProducts();
    document.getElementById("statusText").textContent = `Displaying ${ALL_PRODUCTS.length} unique products.`;
  }catch(err){
    console.error(err);
    document.getElementById("statusText").textContent = "Failed to load products.";
    document.getElementById("productsTableBody").innerHTML = '<tr><td colspan="8">Error loading data.</td></tr>';
  }
}

function populateCategoryFilter(){
  const sel = document.getElementById("filterCategory");
  sel.innerHTML = '<option value="">All Categories</option>';
  const cats = [...new Set(ALL_PRODUCTS.map(p => (p["Category"]||"").toString().trim()).filter(Boolean))];
  cats.forEach(c => { 
    const o = document.createElement("option"); 
    o.value = c; 
    o.textContent = c; 
    sel.appendChild(o); 
  });
}

function getFilteredProducts(){
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  const cat = document.getElementById("filterCategory").value;
  const stock = document.getElementById("filterStock").value;

  let list = ALL_PRODUCTS.slice();

  if(q){
    list = list.filter(p => {
      const name = (p["Name"]||"").toString().toLowerCase();
      const sku = (p["SKU"]||"").toString().toLowerCase();
      return name.includes(q) || sku.includes(q);
    });
  }

  if(cat) list = list.filter(p => (p["Category"]||"") === cat);

  if(stock === "in") list = list.filter(p => Number(p["Stock"]||0) > 0);
  else if(stock === "low") list = list.filter(p => { const s = Number(p["Stock"]||0); return s>0 && s<=5; });
  else if(stock === "out") list = list.filter(p => Number(p["Stock"]||0) <= 0);

  return list;
}

function renderProducts(){
  const tableBody = document.getElementById("productsTableBody");
  const cardsGrid = document.getElementById("cardsGrid");
  const statusEl = document.getElementById("statusText");

  tableBody.innerHTML = "";
  cardsGrid.innerHTML = "";

  const list = getFilteredProducts();

  if(!list.length){
    tableBody.innerHTML = '<tr><td colspan="8">No products matched your search.</td></tr>';
    statusEl.textContent = "No items found.";
    return;
  }

  list.forEach(p => {
    const tr = document.createElement("tr");

    const tdImg = document.createElement("td"); tdImg.className = "thumb-cell";
    const img = document.createElement("img"); img.className = "thumb-img";
    img.alt = p["Name"] || "";
    img.src = normalizeImageForThumb(p["Image URL 1"] || p["Image URL 2"] || "");
    img.onerror = () => { img.style.display = 'none'; };
    img.onclick = () => openEdit(p);
    tdImg.appendChild(img);

    const tdSku = document.createElement("td"); tdSku.textContent = p["SKU"] || "";
    const tdName = document.createElement("td"); tdName.textContent = p["Name"] || "";
    const tdPrice = document.createElement("td"); tdPrice.textContent = "₹" + (p["Price"]||"0");

    const tdStock = document.createElement("td");
    const stockVal = Number(p["Stock"]||0);
    const stockBadge = document.createElement("span");
    stockBadge.style.padding = "4px 8px"; stockBadge.style.borderRadius="999px"; stockBadge.style.fontSize="11px"; stockBadge.style.fontWeight="700";
    if(stockVal <= 0){ stockBadge.style.background = "#fee2e2"; stockBadge.style.color="#991b1b"; stockBadge.textContent = "Out ("+stockVal+")"; }
    else if(stockVal <= 5){ stockBadge.style.background = "#fef3c7"; stockBadge.style.color="#92400e"; stockBadge.textContent = "Low ("+stockVal+")"; }
    else { stockBadge.style.background = "#dcfce7"; stockBadge.style.color="#166534"; stockBadge.textContent = "In ("+stockVal+")"; }
    tdStock.appendChild(stockBadge);

    const tdCat = document.createElement("td"); tdCat.textContent = p["Category"] || "-";
    const tdRating = document.createElement("td"); tdRating.textContent = p["Rating"] ? (p["Rating"] + " ★") : "–";

    const tdActions = document.createElement("td");
    const btnEdit = document.createElement("button"); btnEdit.className="btn-small"; btnEdit.textContent="Edit"; btnEdit.onclick = ()=>openEdit(p);
    const btnDelete = document.createElement("button"); btnDelete.className="btn-small"; btnDelete.style.background="#fee2e2"; btnDelete.style.color="#991b1b"; btnDelete.style.borderColor="#fecaca"; btnDelete.style.marginLeft="4px"; btnDelete.textContent="Delete"; btnDelete.onclick=()=>deleteProduct(p);
    tdActions.appendChild(btnEdit); tdActions.appendChild(btnDelete);

    tr.appendChild(tdImg); tr.appendChild(tdSku); tr.appendChild(tdName); tr.appendChild(tdPrice);
    tr.appendChild(tdStock); tr.appendChild(tdCat); tr.appendChild(tdRating); tr.appendChild(tdActions);

    tableBody.appendChild(tr);
  });

  list.forEach(p => {
    const card = document.createElement("div"); card.className="product-fcard";

    const img = document.createElement("img"); img.className="fcard-img"; img.alt = p["Name"] || "";
    img.src = normalizeImageForThumb(p["Image URL 1"] || "");
    img.onerror = () => { img.style.display = 'none'; };

    const title = document.createElement("div"); title.className="fcard-title"; title.textContent = p["Name"] || "(No title)";
    const price = document.createElement("div"); price.className="fcard-price"; price.textContent = p["Price"] ? ("₹"+p["Price"]) : "";

    const row = document.createElement("div"); row.className="fcard-row";
    const skuEl = document.createElement("div"); skuEl.className="muted"; skuEl.textContent = "SKU: "+(p["SKU"]||"");
    const stockEl = document.createElement("div"); stockEl.className="muted"; stockEl.textContent = "Stock: "+(p["Stock"]||0);
    row.appendChild(skuEl); row.appendChild(stockEl);

    const actions = document.createElement("div"); actions.className="fcard-actions";
    const btnEdit2 = document.createElement("button"); btnEdit2.className="btn-small"; btnEdit2.textContent="Edit Details"; btnEdit2.onclick=()=>openEdit(p);
    actions.appendChild(btnEdit2);

    card.appendChild(img); card.appendChild(title); card.appendChild(price); card.appendChild(row); card.appendChild(actions);
    cardsGrid.appendChild(card);
  });

  statusEl.textContent = `Showing ${list.length} of ${ALL_PRODUCTS.length} products.`;
}

function syncImagePreview(slot){
  const input = document.getElementById("editImg"+slot);
  const url = (input?.value || "").trim();
  const img = document.getElementById("previewImg"+slot);
  const ph = document.getElementById("placeholder"+slot);
  if(url){
    img.src = normalizeImageForThumb(url);
    img.style.display = "block";
    if(ph) ph.style.display = "none";
  } else {
    if(img) img.style.display = "none";
    if(ph) ph.style.display = "block";
  }
}

function clearImageField(slot){ 
  document.getElementById("editImg"+slot).value = ""; 
  syncImagePreview(slot); 
}

async function handleImageUpload(event, slot){
  const file = event.target.files[0];
  if(!file) return;
  const status = document.getElementById("editStatus");
  status.textContent = `Uploading image ${slot}...`;

  try{
    const base64 = await fileToBase64(file);
    const data = await callAppsScript({
      action: "uploadMedia",
      base64: base64,
      mimeType: file.type || "image/jpeg",
      fileName: `product_${Date.now()}_slot${slot}`
    });

    if(!data.success || !data.url) throw new Error(data.message || "Image upload failed");
    document.getElementById("editImg"+slot).value = data.url;
    syncImagePreview(slot);
    status.textContent = `Image ${slot} uploaded successfully.`;
  } catch(err){
    console.error(err);
    status.textContent = "Upload failed: " + err.message;
  } finally {
    event.target.value = "";
  }
}

function fileToBase64(file){ 
  return new Promise((resolve, reject) => { 
    const reader = new FileReader(); 
    reader.onload = () => resolve(reader.result); 
    reader.onerror = err => reject(err); 
    reader.readAsDataURL(file); 
  }); 
}

function openEdit(product){
  CURRENT_EDIT_PRODUCT = product;
  document.getElementById("editOverlay").style.display = "flex";
  document.getElementById("editTitle").textContent = "Edit Product: " + (product["SKU"]||"");
  document.getElementById("editSku").value = product["SKU"] || "";
  document.getElementById("editName").value = product["Name"] || "";
  document.getElementById("editPrice").value = product["Price"] || "";
  document.getElementById("editStock").value = product["Stock"] || "";
  document.getElementById("editDesc").value = product["Description"] || "";

  for(let i=1; i<=3; i++){
    const val = product["Image URL " + i] || "";
    document.getElementById("editImg"+i).value = val;
    syncImagePreview(i);
  }
  document.getElementById("editStatus").textContent = "Modify details and click Update Product.";
}

function closeEdit(){ 
  document.getElementById("editOverlay").style.display = "none"; 
  CURRENT_EDIT_PRODUCT = null; 
}

document.getElementById("saveEditBtn").addEventListener("click", saveEdit);

async function saveEdit(){
  if(!CURRENT_EDIT_PRODUCT) return;
  const statusEl = document.getElementById("editStatus");
  statusEl.textContent = "Saving changes to Google Sheet...";

  const payload = {
    action: "updateProduct",
    sku: document.getElementById("editSku").value.trim(),
    name: document.getElementById("editName").value.trim(),
    price: document.getElementById("editPrice").value.trim(),
    stock: document.getElementById("editStock").value.trim(),
    description: document.getElementById("editDesc").value.trim(),
    imageUrl1: document.getElementById("editImg1").value.trim(),
    imageUrl2: document.getElementById("editImg2").value.trim(),
    imageUrl3: document.getElementById("editImg3").value.trim()
  };

  try{
    const data = await callAppsScript(payload);
    if(!data.success) throw new Error(data.message || "Failed to update product.");

    const idx = ALL_PRODUCTS.findIndex(p => (p["SKU"]||"") === payload.sku);
    if(idx > -1){
      ALL_PRODUCTS[idx]["Name"] = payload.name;
      ALL_PRODUCTS[idx]["Price"] = payload.price;
      ALL_PRODUCTS[idx]["Stock"] = payload.stock;
      ALL_PRODUCTS[idx]["Description"] = payload.description;
      ALL_PRODUCTS[idx]["Image URL 1"] = payload.imageUrl1;
      ALL_PRODUCTS[idx]["Image URL 2"] = payload.imageUrl2;
      ALL_PRODUCTS[idx]["Image URL 3"] = payload.imageUrl3;
    }
    renderProducts();
    statusEl.textContent = "Saved successfully! ✔";
    setTimeout(closeEdit, 800);
  } catch(err){
    console.error(err);
    statusEl.textContent = "Error: " + err.message;
  }
}

async function deleteProduct(product){
  const sku = product["SKU"];
  if(!sku) return;
  if(!confirm(`Are you sure you want to delete product ${sku}?`)) return;

  try{
    document.getElementById("statusText").textContent = `Deleting ${sku}...`;
    const data = await callAppsScript({ action: "deleteProduct", sku: sku });
    if(!data.success) throw new Error(data.message || "Delete failed.");

    ALL_PRODUCTS = ALL_PRODUCTS.filter(p => (p["SKU"]||"") !== sku);
    renderProducts();
    document.getElementById("statusText").textContent = `Deleted ${sku}.`;
  } catch(err){
    console.error(err);
    document.getElementById("statusText").textContent = "Error deleting product: " + err.message;
  }
}

document.addEventListener("DOMContentLoaded", ()=>{
  document.getElementById("searchInput").addEventListener("input", renderProducts);
  document.getElementById("filterCategory").addEventListener("change", renderProducts);
  document.getElementById("filterStock").addEventListener("change", renderProducts);

  for(let i=1; i<=3; i++){
    document.getElementById("editImg"+i).addEventListener("input", ()=>syncImagePreview(i));
  }

  initAdminLogin();
});
</script>
