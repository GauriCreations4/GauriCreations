<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Register • Gauri Creations</title>

<!-- Favicon -->
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="favicon.ico"> 

<style>
  :root {
    --bg-grad: linear-gradient(135deg, #86e1ff, #ffd4b8);
    --card-bg: rgba(255, 255, 255, 0.95);
    --shadow: 0 20px 40px rgba(15, 23, 42, 0.18);
    --primary-blue: #2563eb;
    --accent-pink: #ec4899;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-grad);
    padding: 20px 20px calc(80px + env(safe-area-inset-bottom)) 20px;
    color: #0f172a;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card-bg);
    padding: 30px 24px;
    border-radius: 24px;
    box-shadow: var(--shadow);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 1px solid rgba(255, 255, 255, 0.7);
  }

  .logo {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    object-fit: cover;
    margin-bottom: 8px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
  }

  h2 { margin: 4px 0 16px; font-size: 22px; font-weight: 800; }

  /* Input Controls */
  input, textarea {
    width: 100%;
    padding: 12px 16px;
    margin-top: 10px;
    border-radius: 14px;
    border: 1px solid #cbd5e1;
    font-size: 14px;
    background: #ffffff;
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  input:focus, textarea:focus {
    border-color: var(--primary-blue);
  }

  textarea { resize: vertical; min-height: 70px; }

  button {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--primary-blue), var(--accent-pink));
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
    transition: transform 0.1s, opacity 0.2s;
  }

  button:active { transform: scale(0.98); }

  .guest-btn {
    background: #ffffff;
    color: #334155;
    border: 1px solid #cbd5e1;
    margin-top: 10px;
    box-shadow: none;
  }

  .guest-btn:hover { background: #f8fafc; }

  .error {
    color: #dc2626;
    font-size: 13px;
    margin-top: 12px;
    min-height: 18px;
    font-weight: 600;
  }

  .small {
    font-size: 13px;
    margin-top: 18px;
    color: #64748b;
  }

  .small a {
    color: var(--primary-blue);
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>

<body>

<div class="card">
  <img src="logo-gauri.jpeg" alt="Gauri Creations" class="logo" onerror="this.src='https://via.placeholder.com/60?text=GC'">
  <h2>Create Account</h2>

  <input id="name" placeholder="Full Name *" required />
  <input id="email" type="email" placeholder="Email Address *" required />
  <input id="phone" type="tel" placeholder="10-Digit Phone Number *" required />
  <textarea id="address" rows="3" placeholder="Delivery Address (House No, Street, City)"></textarea>
  <input id="password" type="password" placeholder="Password *" required />

  <button id="registerBtn" onclick="register()">Create Account</button>
  <button type="button" class="guest-btn" onclick="continueAsGuest()">Continue as Guest</button>

  <div id="error" class="error"></div>

  <div class="small">
    Already have an account? <a href="login.html">Login</a>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyGE0vN4yxngAyqooJAnULrBQbbNc6kyluYSg7JgydWeJ5481HmsFxVgC8kCWBvE3Wq/exec";

/* CORS-Safe Fetch Helper */
async function callAppsScript(payload) {
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

function continueAsGuest() {
  window.location.href = "index.html";
}

async function register() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();
  const password = document.getElementById("password").value.trim();

  const errorBox = document.getElementById("error");
  const regBtn = document.getElementById("registerBtn");
  errorBox.textContent = "";

  if (!name || !email || !phone || !password) {
    errorBox.textContent = "Please fill in all required fields (*)";
    return;
  }

  regBtn.disabled = true;
  regBtn.textContent = "Creating Account...";

  try {
    const data = await callAppsScript({
      action: "customerSignup",
      name: name,
      email: email,
      phone: phone,
      address: address,
      password: password
    });

    if (!data.success) {
      errorBox.textContent = data.message || "Registration failed. Try a different email.";
      regBtn.disabled = false;
      regBtn.textContent = "Create Account";
      return;
    }

    // Auto-login session storage including phone and address
    localStorage.setItem("gc_customer", JSON.stringify({
      id: data.customerId,
      name: name,
      email: email,
      phone: phone,
      address: address
    }));

    window.location.href = "index.html";

  } catch (err) {
    console.error(err);
    errorBox.textContent = "Network error. Please try again.";
    regBtn.disabled = false;
    regBtn.textContent = "Create Account";
  }
}
</script>

</body>
</html>
