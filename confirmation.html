<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Order Confirmed • Gauri Creations</title>

<!-- Favicon -->
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="favicon.ico">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
  :root {
    --bg-grad: linear-gradient(135deg, #86e1ff, #ffd4b8);
    --card-bg: rgba(255, 255, 255, 0.95);
    --shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    --primary-blue: #2563eb;
    --text-dark: #0f172a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-grad);
    /* Mobile safe area padding at the bottom */
    padding: 20px 20px calc(80px + env(safe-area-inset-bottom)) 20px;
    color: var(--text-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    padding: 28px 24px;
    border-radius: 24px;
    text-align: center;
    box-shadow: var(--shadow);
    animation: fadeIn 0.6s ease;
    position: relative;
    z-index: 10;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Google Pay Checkmark Animation */
  .gpay-success {
    width: 110px;
    margin: 0 auto 16px;
  }

  .gpay-success svg {
    width: 100%;
    display: block;
  }

  .pulse {
    fill: #22c55e;
    opacity: 0.25;
    animation: pulse 1.2s ease-out forwards;
  }

  .ring {
    fill: none;
    stroke: #22c55e;
    stroke-width: 4;
    stroke-dasharray: 283;
    stroke-dashoffset: 283;
    animation: ring 0.6s ease-out forwards;
    animation-delay: 0.2s;
  }

  .check {
    fill: none;
    stroke: #22c55e;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: check 0.4s ease-out forwards;
    animation-delay: 0.8s;
  }

  @keyframes pulse {
    0% { r: 0; opacity: 0.4; }
    100% { r: 50; opacity: 0; }
  }

  @keyframes ring {
    to { stroke-dashoffset: 0; }
  }

  @keyframes check {
    to { stroke-dashoffset: 0; }
  }

  h2 {
    margin: 0 0 12px;
    font-size: 22px;
    font-weight: 800;
  }

  p {
    font-size: 14px;
    color: #475569;
    margin: 6px 0;
  }

  .order-info {
    background: #f8fafc;
    border-radius: 14px;
    padding: 12px;
    margin: 16px 0;
    border: 1px solid #e2e8f0;
  }

  .btn {
    width: 100%;
    padding: 13px;
    background: #ffffff;
    color: var(--text-dark);
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: transform 0.1s, background 0.2s;
  }

  .btn-track {
    background: var(--primary-blue);
    color: #ffffff;
    border: none;
    margin-top: 16px;
    box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
  }

  .btn:active {
    transform: scale(0.98);
  }
</style>
</head>

<body>

<div class="card">

  <div class="gpay-success">
    <svg viewBox="0 0 100 100">
      <circle class="pulse" cx="50" cy="50" r="50"/>
      <circle class="ring" cx="50" cy="50" r="45"/>
      <path class="check" d="M30 52 L45 66 L70 38"/>
    </svg>
  </div>

  <h2>Order Confirmed!</h2>

  <div class="order-info">
    <p><strong>Order ID:</strong> <span id="orderId">Loading...</span></p>
    <p><strong>Expected Delivery:</strong> <span id="deliveryDate">Calculated date...</span></p>
  </div>

  <p>Thank you for shopping with Gauri Creations 🤍<br>Your order is now being processed.</p>

  <button class="btn btn-track" id="trackBtn">Track Your Order</button>
  <button class="btn" onclick="window.location.href='index.html'">Back to Store</button>

</div>

<script>
/* 1. ORDER DETAILS LOGIC */
let orderId = new URLSearchParams(window.location.search).get("orderId");

try {
  if (orderId && (orderId.startsWith('{') || orderId.startsWith('"'))) {
    const parsed = JSON.parse(orderId);
    orderId = parsed.orderId || parsed; 
  }
} catch (e) {}

const finalOrderId = orderId || "PENDING";
document.getElementById("orderId").textContent = finalOrderId;

// Set estimated delivery 7 days from today
let date = new Date();
date.setDate(date.getDate() + 7);
document.getElementById("deliveryDate").textContent = date.toDateString();

// Track button routing
document.getElementById("trackBtn").onclick = function () {
  if (finalOrderId !== "PENDING") {
    window.location.href = `track.html?orderId=${encodeURIComponent(finalOrderId)}`;
  } else {
    window.location.href = `track.html`;
  }
};

// Haptic vibration feedback for mobile devices
if (navigator.vibrate) {
  navigator.vibrate([100, 50, 100]);
}

/* 2. CONFETTI ANIMATION */
function launchConfetti() {
  if (typeof confetti !== "function") return;

  var duration = 3 * 1000;
  var animationEnd = Date.now() + duration;
  var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

  function randomInRange(min, max) {
    return Math.random() * (max - min) + min;
  }

  var interval = setInterval(function() {
    var timeLeft = animationEnd - Date.now();

    if (timeLeft <= 0) {
      return clearInterval(interval);
    }

    var particleCount = 50 * (timeLeft / duration);
    
    confetti(Object.assign({}, defaults, { 
      particleCount, 
      origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } 
    }));
    confetti(Object.assign({}, defaults, { 
      particleCount, 
      origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } 
    }));
  }, 250);
}

window.onload = launchConfetti;
</script>

</body>
</html>
